# Server Configuration
server.port=8080

# Datasource Configuration (read from environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Admin Credentials (read from environment variables)
admin.username=${ADMIN_USER}
admin.password=${ADMIN_PASS}

# Token Configuration
token.expiry-hours=24

# AI Configuration (for future use - read from environment variables)
ai.model=gemini-pro
ai.api-key=${AI_API_KEY}

# Upload Configuration
upload.max-file-size=10MB
upload.allowed-types=image/jpeg,image/png,application/pdf